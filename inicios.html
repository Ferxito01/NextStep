<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NextStep | Iniciar sesión</title>

    <meta
      name="description"
      content="Inicia sesión o regístrate en NextStep."
    />

    <link rel="icon" href="images/logo.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- ===== ENCABEZADO ===== -->
    <header class="header">
      <div class="contenedor header-contenido">

        <a class="marca" href="index.html">
          <img
            src="images/logo.jpg"
            alt="Logo de NextStep"
            class="marca-logo"
          />

          <img
            src="images/titulo.jpg"
            alt="NextStep"
            class="marca-titulo"
          />
        </a>

        <nav class="menu">
          <a href="index.html#inicio">Inicio</a>
          <a href="index.html#becas">Becas</a>
          <a href="index.html#nosotros">Nosotros</a>
          <a href="index.html#contacto">Contacto</a>
        </nav>

      </div>
    </header>


    <!-- ===== INICIO DE SESIÓN ===== -->
    <main>

      <section class="inicio-sesion">

        <div class="contenedor contenedor-angosto">

          <div class="tarjeta-login">

            <img
              src="images/logo.jpg"
              alt="Logo de NextStep"
              class="login-logo"
            />

            <h1>Bienvenido a NextStep</h1>

            <p>
              Elige una opción para continuar.
            </p>


            <!-- OPCIÓN GOOGLE -->
            <a href="#" class="boton-google">
              <span>G</span>
              Iniciar sesión con Google
            </a>


            <div class="separador">
              <span>o</span>
            </div>


            <!-- OPCIÓN REGISTRARSE -->
            <a href="Registrarse.html" class="boton boton-registro">
              Registrarse
            </a>


            <p class="login-regreso">
              ¿Ya tienes una cuenta?
              <a href="#">Inicia sesión</a>
            </p>

          </div>

        </div>

      </section>

    </main>


    <!-- ===== PIE DE PÁGINA ===== -->
    <footer class="pie">

      <div class="contenedor">

        <p>
          NextStep — Información de becas para nuestra comunidad educativa.
        </p>

      </div>

    </footer>

  </body>
</html>
